<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>V-Interact Marker</title>
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #marker-icon {
        color: #ffffffdd;
        font-size: 216px;
        text-shadow:
            0 0 3px #000, 0 0 3px #000, 0 0 3px #000, 0 0 3px #000,
            0 3px 8px rgba(0, 0, 0, 0.65);
        filter: blur(5px);
    }
</style>
</head>
<body>
    <i id="marker-icon"></i>
    <script>
        const raw = new URLSearchParams(location.search).get('icon') || 'circle';
        const classes = /\s|^fa-/.test(raw) ? raw.split(/\s+/) : ['fa-solid', 'fa-' + raw];
        document.getElementById('marker-icon').classList.add(...classes);
    </script>
</body>
</html>
